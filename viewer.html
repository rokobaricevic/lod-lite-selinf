<style>

:root{

 --line:#2C2C2E;--line-soft:#232325;--line-hi:#3A3A3C;
 --t-hi:#FFF;--t:#F2F2F2;--t-mid:#C7C7CC;--t-low:#A1A1A6;--t-off:#8E8E93;--icon:#E5E5EA;

 --scrim:rgba(0,0,0,.6);--fp-shadow:0 8px 28px rgba(0,0,0,.55);--pin-shadow:0 2px 8px rgba(0,0,0,.5);
 --dialog-shadow:0 24px 64px rgba(0,0,0,.7);
 --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
 --font-display:"Jura",var(--font-sans);
 --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
 --r-sm:8px;--r:10px;--r-pill:12px;--r-panel:14px;--r-swatch:3px;
 --inset:16px;--h-btn:34px;--h-row:42px;--h-pill:44px;--h-dock:52px;--h-tool:40px;--w-insp:332px;--fast:80ms;
}
@media (pointer:coarse){:root{--h-tool:44px;--h-dock:56px}} /* fingers: 44 px tools, the dock grows with them */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}

[hidden]{display:none!important}

#name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 15px var(--font-display);color:var(--t)}

  padding:16px;border-radius:var(--r-panel);box-shadow:var(--dialog-shadow);font:13px/1.45 var(--font-sans);color:var(--t-low);white-space:pre-wrap;overflow-wrap:anywhere}

#hint{top:calc(68px + env(safe-area-inset-top));bottom:auto}

@media (pointer:coarse){

}

<script>// script and loading errors on the page itself, for whoever has no console open (data-soft: the page works without it)
const showErr = (m) => { const e = document.getElementById('err'); e.textContent += (e.textContent && '\n') + m; };
addEventListener('error', (e) => { if (e.target?.dataset?.soft == null) showErr(e.message || 'could not load ' + (e.target?.src || e.target?.href)); }, true);

<script type="module">
import * as THREE from 'three';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const params = new URLSearchParams(location.search);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 5000);
scene.add(camera);

const ktx2 = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/libs/basis/').detectSupport(renderer);

// the browser keeps ~6 connections to a server: 4 for tiles leaves room for an alt-click, which otherwise waits behind
// tile downloads for as long as they take (minutes over the PC's ~1 MB/s upload)
tiles.downloadQueue.maxJobsPerOrigin = 4;

const debug = new DebugTilesPlugin({
  enabled: true, displayBoxBounds: false, unlit: true,

// 200k-triangle leaves crashed iOS Safari when zoomed in on a crack)

tiles.setCamera(camera);

  const dist = (diag / 2 / Math.tan((camera.fov * Math.PI) / 360)) * 1.05;

  const geoSeen = new Set(), texSeen = new Set();

// R or its dock tool: a one-pointer drag zooms instead of orbiting (up = closer); right/shift-drag still pans

const hudTool = ui.tool({ label: 'Tehnički prikaz', icon: ICON.gauge, order: 40, onClick: () => setHud(hud.hidden) });

addSlider('error target {v} px', 1, 128, tiles.errorTarget, (v) => (tiles.errorTarget = v));

const CM = DebugTilesPlugin.ColorModes;
addToggle('colour by tile depth', (on) => { debug.colorMode = on ? CM.CUSTOM_COLOR : CM.NONE; debug.update(); });
addToggle('wireframe', (on) => { S.wireframe = on; for (const t of tiles.lruCache.itemSet.keys()) t.engineData?.scene?.traverse((o) => { if (o.material) o.material.wireframe = on; }); });

addToggle('freeze LOD', (on) => (S.frozen = on));
const uncapped = addToggle('uncapped fps (GPU-paced)', (on) => setUncapped(on));
const help = document.createElement('div'); help.className = 'help';
help.textContent = TOUCH ? 'drag orbit | pinch zoom | 2-finger pan | double-tap pivot | tap damage'
  : 'drag orbit (R: drag zooms, up = in) | right/shift-drag pan | wheel zoom@cursor | dbl-click pivot | F fit';
ctl.append(help);

const maxAniso = renderer.capabilities.getMaxAnisotropy(); // grazing views of the deck stay sharp
// once on the GPU, a tile texture's JS copy of its mips is dead weight (about half the tile's memory, in the process
// iOS kills): drop it after the upload. The LRU then sizes the texture from its dimensions, the HUD from lodBytes.
const dropCpuCopy = (t) => { t.mipmaps = t.mipmaps.map(({ width, height }) => ({ width, height })); t.onUpdate = null; };
tiles.addEventListener('load-model', ({ scene: s }) => s.traverse((o) => {

// ---------- loop ----------

    `${s.fps} fps  ${s.frameMs} ms  worst ${s.worstMs} ms\ncalls ${s.drawCalls}  tris ${(s.triangles / 1e6).toFixed(2)}M\n` +
    `tiles loaded ${s.loadedTiles}  visible ${s.visibleTiles}\ndl ${s.downloading}  parse ${s.parsing}  queued ${s.queued}\n` +
