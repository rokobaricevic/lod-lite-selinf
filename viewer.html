<!doctype html>
<html><head><meta charset="utf-8"><title>LOD viewer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#15171a;overflow:hidden}
canvas{display:block;width:100%;height:100%;outline:none}
#hud{position:fixed;top:6px;left:6px;font:11px/1.35 ui-monospace,Menlo,monospace;color:#d8d8d8;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:3px;min-width:250px;user-select:none}
#hud pre{margin:0 0 4px;font:inherit}
#hud label{display:block;cursor:pointer}
#hud .row{display:flex;gap:6px;align-items:center}
#hud input[type=range]{flex:1;height:12px}
#hud .hint{color:#888;margin-top:4px}
</style>
<script type="importmap">{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
"3d-tiles-renderer/three":"https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.3/build/index.three.js",
"3d-tiles-renderer/plugins":"https://cdn.jsdelivr.net/npm/3d-tiles-renderer@0.5.3/build/index.plugins.js"}}</script>
</head>
<body><div id="hud"><pre id="stats"></pre><div id="ctl"></div></div>
<script type="module">
import * as THREE from 'three';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { TilesRenderer } from '3d-tiles-renderer/three';
import { GLTFExtensionsPlugin, DebugTilesPlugin } from '3d-tiles-renderer/plugins';

const params = new URLSearchParams(location.search);
const TILESET = params.get('tileset') || 'out/tileset.json';
const LRU_MAX_MB = 8192, MB = 1048576;
const LRU_MB = Math.min(LRU_MAX_MB, Math.max(64, +params.get('lru') || 3072));
// world is Y-up, source is Z-up: tiles.group is rotated -90deg about X, so world = (X, Z, -Y) of source
const src2w = (p) => new THREE.Vector3(p[0], p[2], -p[1]);
const w2src = (v) => [v.x, -v.z, v.y];

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x15171a);
document.body.appendChild(renderer.domElement);
const el = renderer.domElement;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 5000);
scene.add(camera);

const ktx2 = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/libs/basis/').detectSupport(renderer);
const tiles = new TilesRenderer(TILESET);
tiles.registerPlugin(new GLTFExtensionsPlugin({ meshoptDecoder: MeshoptDecoder, ktxLoader: ktx2 }));
const PALETTE = [0x4da3ff, 0x4dd17a, 0xffc24d, 0xff6b6b, 0xc77dff, 0x4de3e3, 0xffffff];
const debug = new DebugTilesPlugin({
  enabled: true, displayBoxBounds: false, unlit: true,
  customColorCallback: (tile, obj) => { const c = new THREE.Color(PALETTE[Math.min(tile.internal.depth, PALETTE.length - 1)]); obj.traverse((o) => o.material?.color?.copy(c)); },
});
tiles.registerPlugin(debug);
tiles.group.rotation.x = -Math.PI / 2;
tiles.group.updateMatrixWorld(true);
tiles.errorTarget = 16;
tiles.setCamera(camera);
const setLruMB = (mb) => { tiles.lruCache.maxBytesSize = mb * MB; tiles.lruCache.minBytesSize = mb * 0.75 * MB; };
setLruMB(LRU_MB);
tiles.lruCache.maxSize = 100000; tiles.lruCache.minSize = 50000;
scene.add(tiles.group);

const S = { frozen: false, wireframe: false, uncapped: false };
let diag = 1, center = [0, 0, 0], frames = 0, worst = 0, winT = performance.now(), lastT = winT, fps = 0, frameMs = 0, worstMs = 0;
const pivot = new THREE.Vector3();
const marker = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff3030, depthTest: false }));
marker.renderOrder = 999; marker.visible = false; scene.add(marker);

// ---------- orbit / pan / zoom-to-cursor ----------
const raycaster = new THREE.Raycaster(); raycaster.firstHitOnly = true;
function pick(ndc) {
  raycaster.setFromCamera(ndc, camera);
  const objs = [...tiles.visibleTiles].map((t) => t.engineData?.scene).filter(Boolean);
  return raycaster.intersectObjects(objs, true)[0] || null;
}
const ndcOf = (e) => { const r = el.getBoundingClientRect(); return new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); };
function lookAtPivot() {
  camera.up.set(0, 1, 0); camera.lookAt(pivot); camera.updateMatrixWorld(true);
  const r = camera.position.distanceTo(pivot);
  camera.near = Math.max(0.002, Math.min(1, r * 0.002));
  camera.far = Math.max(2000, r + diag * 6);
  camera.updateProjectionMatrix();
  marker.position.copy(pivot); marker.scale.setScalar(Math.max(0.003, r * 0.006));
}
let drag = null;
el.addEventListener('contextmenu', (e) => e.preventDefault());
el.addEventListener('pointerdown', (e) => { el.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, pan: e.button === 2 || e.button === 1 || e.shiftKey }; });
el.addEventListener('pointerup', (e) => { drag = null; el.releasePointerCapture(e.pointerId); });
el.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.pan) {
    const k = (2 * Math.tan((camera.fov * Math.PI) / 360) * camera.position.distanceTo(pivot)) / el.clientHeight;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    const d = right.multiplyScalar(-dx * k).add(up.multiplyScalar(dy * k));
    camera.position.add(d); pivot.add(d);
  } else {
    const off = camera.position.clone().sub(pivot), sph = new THREE.Spherical().setFromVector3(off);
    sph.theta -= dx * 0.005; sph.phi = Math.min(Math.PI - 0.01, Math.max(0.01, sph.phi - dy * 0.005));
    camera.position.copy(pivot).add(off.setFromSpherical(sph));
  }
  lookAtPivot();
});
el.addEventListener('dblclick', (e) => {
  const h = pick(ndcOf(e)); if (!h) return;
  pivot.copy(h.point); marker.visible = true; lookAtPivot();
  clearTimeout(marker._t); marker._t = setTimeout(() => (marker.visible = false), 1500);
});
el.addEventListener('wheel', (e) => {
  e.preventDefault();
  const f = Math.exp(e.deltaY * 0.0015), ndc = ndcOf(e), r = camera.position.distanceTo(pivot), hit = pick(ndc);
  camera.position.addScaledVector(raycaster.ray.direction, (hit ? hit.distance : r) * (1 - f)); // toward the point under the cursor
  pivot.copy(camera.position).addScaledVector(camera.getWorldDirection(new THREE.Vector3()), Math.max(1e-4, r * f));
  lookAtPivot();
}, { passive: false });
addEventListener('keydown', (e) => { if (e.target.tagName !== 'INPUT' && e.key.toLowerCase() === 'f') fit(); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

function fit() {
  pivot.copy(src2w(center));
  const dist = (diag / 2 / Math.tan((camera.fov * Math.PI) / 360)) * 1.05;
  camera.position.copy(pivot).addScaledVector(new THREE.Vector3(0.35, 0.55, 0.75).normalize(), dist);
  lookAtPivot();
}
const setView = ({ eye, target }) => { camera.position.copy(src2w(eye)); pivot.copy(src2w(target)); lookAtPivot(); };

// ---------- stats ----------
// compressed textures: sum of mip data; uncompressed: RGBA8 + mips. Recorded at load (image may be released after upload).
function textureBytes(v) {
  if (v.isCompressedTexture && v.mipmaps?.length) return v.mipmaps.reduce((a, m) => a + (m.data?.byteLength || 0), 0);
  const im = v.image; return (im?.width || 0) * (im?.height || 0) * 4 * (v.generateMipmaps === false ? 1 : 4 / 3);
}
function stats() {
  const st = tiles.stats, byDepth = {}; let visible = 0, maxDepth = -1, loaded = 0, geo = 0, tex = 0;
  for (const t of tiles.visibleTiles) if (t.engineData?.scene) { visible++; const d = t.internal.depth; maxDepth = Math.max(maxDepth, d); byDepth[d] = (byDepth[d] || 0) + 1; }
  const geoSeen = new Set(), texSeen = new Set();
  for (const t of tiles.lruCache.itemSet.keys()) if (t.engineData?.scene) loaded++;
  for (const t of tiles.lruCache.itemSet.keys()) t.engineData?.scene?.traverse((o) => {
    const g = o.geometry;
    if (g && !geoSeen.has(g)) { geoSeen.add(g); for (const a of Object.values(g.attributes)) geo += a.array.byteLength; if (g.index) geo += g.index.array.byteLength; }
    for (const v of Object.values(o.material || {})) if (v?.isTexture && !texSeen.has(v)) { texSeen.add(v); tex += v.userData.lodBytes || 0; }
  });
  const r = (x) => +(x / MB).toFixed(2);
  return {
    fps: +fps.toFixed(1), frameMs: +frameMs.toFixed(2), worstMs: +worstMs.toFixed(1), drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles,
    loadedTiles: loaded, visibleTiles: visible, queued: st.queued, downloading: st.downloading, parsing: st.parsing, failed: st.failed,
    maxVisibleDepth: maxDepth, visibleByDepth: byDepth, geometryMB: r(geo), textureMB: r(tex), gpuMB: r(geo + tex),
    errorTarget: tiles.errorTarget, lruMaxMB: Math.round(tiles.lruCache.maxBytesSize / MB), eye: w2src(camera.position).map((v) => +v.toFixed(3)),
  };
}

// ---------- HUD ----------
const statsEl = document.getElementById('stats'), ctl = document.getElementById('ctl');
function addToggle(label, fn) {
  const l = document.createElement('label'), c = document.createElement('input'); c.type = 'checkbox';
  c.onchange = () => fn(c.checked); l.append(c, ' ' + label); ctl.append(l); return c;
}
function addSlider(label, min, max, val, fn, fmt = (v) => v) {
  const row = document.createElement('div'), t = document.createElement('span'), s = document.createElement('input');
  row.className = 'row'; Object.assign(s, { type: 'range', min, max, step: label.includes('LRU') ? 64 : 1, value: val });
  const upd = () => { t.textContent = label.replace('{v}', fmt(+s.value)); };
  s.oninput = () => { fn(+s.value); upd(); }; upd(); row.append(t, s); ctl.append(row); return { s, upd };
}
// zoom = camera distance to the pivot, log scale from ZOOM_MIN (right) to 4 x the model diagonal (left)
const ZOOM_MIN = 0.05, zoomMax = () => diag * 4;
const zoom2dist = (v) => zoomMax() * (ZOOM_MIN / zoomMax()) ** (v / 1000);
const dist2zoom = (d) => Math.round((1000 * Math.log(zoomMax() / d)) / Math.log(zoomMax() / ZOOM_MIN));
const zoom = addSlider('zoom {v} m', 0, 1000, 0, (v) => { camera.position.sub(pivot).setLength(zoom2dist(v)).add(pivot); lookAtPivot(); },
  (v) => +zoom2dist(v).toPrecision(3));
addSlider('error target {v} px', 1, 128, tiles.errorTarget, (v) => (tiles.errorTarget = v));
const lru = addSlider('LRU {v} MB', 64, LRU_MAX_MB, LRU_MB, setLruMB);
const CM = DebugTilesPlugin.ColorModes;
addToggle('colour by tile depth', (on) => { debug.colorMode = on ? CM.CUSTOM_COLOR : CM.NONE; debug.update(); });
addToggle('wireframe', (on) => { S.wireframe = on; for (const t of tiles.lruCache.itemSet.keys()) t.engineData?.scene?.traverse((o) => { if (o.material) o.material.wireframe = on; }); });
addToggle('bounding boxes', (on) => { debug.displayBoxBounds = on; debug.update(); });
addToggle('freeze LOD', (on) => (S.frozen = on));
const uncapped = addToggle('uncapped fps (GPU-paced)', (on) => setUncapped(on));
const hint = document.createElement('div'); hint.className = 'hint';
hint.textContent = 'drag orbit | right/shift-drag pan | wheel zoom@cursor | dbl-click pivot | F fit'; ctl.append(hint);

const maxAniso = renderer.capabilities.getMaxAnisotropy(); // grazing views of the deck stay sharp
tiles.addEventListener('load-model', ({ scene: s }) => s.traverse((o) => {
  if (!o.material) return;
  if (o.material.map) o.material.map.anisotropy = maxAniso;
  for (const v of Object.values(o.material)) if (v?.isTexture && v.userData.lodBytes === undefined) v.userData.lodBytes = textureBytes(v);
  if (S.wireframe) o.material.wireframe = true;
}));

// ---------- loop ----------
function frame() {
  const now = performance.now(), dt = now - lastT; lastT = now; frames++; worst = Math.max(worst, dt);
  camera.updateMatrixWorld();
  tiles.setResolutionFromRenderer(camera, renderer);
  if (!S.frozen) tiles.update();
  renderer.render(scene, camera);
  if (now - winT < 250) return; // HUD: frames actually rendered in the last window, and its slowest frame
  fps = (frames * 1000) / (now - winT); frameMs = (now - winT) / frames; worstMs = worst; frames = worst = 0; winT = now;
  const mb = Math.round(tiles.lruCache.maxBytesSize / MB); // slider shows the real cap
  if (document.activeElement !== lru.s && +lru.s.value !== mb) { lru.s.max = Math.max(LRU_MAX_MB, mb); lru.s.value = mb; lru.upd(); }
  if (document.activeElement !== zoom.s) { zoom.s.value = dist2zoom(camera.position.distanceTo(pivot)); zoom.upd(); }
  const s = stats();
  statsEl.textContent =
    `${s.fps} fps  ${s.frameMs} ms  worst ${s.worstMs} ms\ncalls ${s.drawCalls}  tris ${(s.triangles / 1e6).toFixed(2)}M\n` +
    `tiles loaded ${s.loadedTiles}  visible ${s.visibleTiles}\ndl ${s.downloading}  parse ${s.parsing}  queued ${s.queued}\n` +
    `max depth ${s.maxVisibleDepth}\nGPU ~${s.gpuMB} MB (geo ${s.geometryMB} + tex ${s.textureMB})\ncam ${s.eye.map((v) => v.toFixed(1))}`;
}
// capped: rAF at the display rate (Safari: 60 Hz unless its 60fps feature flag is off). Uncapped: back-to-back tasks with at
// most 2 frames in flight (GPU fences), so fps counts frames the GPU finished, not how fast JS can queue them.
const gl = renderer.getContext(), fences = [], tick = new MessageChannel();
tick.port1.onmessage = () => {
  if (!S.uncapped) return;
  while (fences.length && gl.getSyncParameter(fences[0], gl.SYNC_STATUS) === gl.SIGNALED) gl.deleteSync(fences.shift());
  if (fences.length < 2) { frame(); fences.push(gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0)); gl.flush(); }
  tick.port2.postMessage(0);
};
function setUncapped(on) {
  S.uncapped = on; lastT = performance.now();
  if (on) { renderer.setAnimationLoop(null); tick.port2.postMessage(0); }
  else { while (fences.length) gl.deleteSync(fences.shift()); renderer.setAnimationLoop(frame); }
}
renderer.setAnimationLoop(frame);
if (params.has('uncapped')) { uncapped.checked = true; setUncapped(true); }

const ready = new Promise((resolve, reject) => {
  tiles.addEventListener('load-tileset', function once() {
    tiles.removeEventListener('load-tileset', once);
    const box = new THREE.Box3();
    if (tiles.getBoundingBox(box)) { center = box.getCenter(new THREE.Vector3()).toArray(); diag = box.min.distanceTo(box.max); }
    fit(); resolve();
  });
  tiles.addEventListener('load-error', (e) => console.warn('[tiles] load-error', e.url, e.error?.message));
  setTimeout(() => reject(new Error('tileset did not load in 30 s: ' + TILESET)), 30000);
});
window.lod = { tiles, camera, stats, setView, ready, scene, el, pick, ndcOf, src2w, w2src, ctl };
</script>
<script type="module" src="selinf.js"></script></body></html>
